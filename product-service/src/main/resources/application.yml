server:
  port: 8083
spring:
  application:
    name: product-service
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximumPoolSize: 10
    url: jdbc:postgresql://localhost:5432/java-pro?currentSchema=public&useUnicode=true&characterEncoding=UTF-8
    username: postgres
    password: postgres

  jpa:
    #    database-platform: ru.vtb.omni.hibernateorm.helper.domain.custom.PostgreSQL10JsonbDialect
    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
