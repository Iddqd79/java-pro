server:

  port: 8082
  servlet:
    context-path: payments-service
spring:
  application:
    name: payment-service
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximumPoolSize: 10
    url: jdbc:postgresql://localhost:5432/java-pro?currentSchema=public&useUnicode=true&characterEncoding=UTF-8
    username: postgres
    password: postgres

  jpa:

    database: postgresql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
integration:
  product-service: http:\\localhost:8083\product-service\
